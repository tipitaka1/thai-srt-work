name: TTS takes
on:
  push:
    branches: [gh-pages]
    paths: ['tts/requests/**']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: tts
jobs:
  tts:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Open the tts-work branch
        run: |
          git fetch --depth=1 origin +refs/heads/tts-work:refs/remotes/origin/tts-work
          git worktree add -B tts-work ../takes origin/tts-work
      - run: pip install --quiet soundfile numpy
      - name: Gemini TTS
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python3 tools/tts_gemini.py tts/requests ../takes
      - name: Save takes
        if: always()
        run: |
          cd ../takes
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "TTS takes for ${GITHUB_SHA::7}"
          git push origin tts-work
